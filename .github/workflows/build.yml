name: Build CarsonDEB ISO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Build ISO
        run: |
          sudo lb clean --purge || true
          sudo sh auto/config

          # Current Debian repositories publish Contents indexes inside each
          # component (for example .../dists/trixie/main/Contents-amd64.gz),
          # while the Ubuntu-packaged live-build script still requests the old
          # .../dists/trixie/Contents-amd64.gz path. Patch that lookup so the
          # kernel stage can build against current Debian mirrors.
          sudo sed -i \
            's#${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz#${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz#' \
            /usr/lib/live/build/chroot_linux-image

          sudo sh auto/build
          sudo chown -R "$USER:$USER" .

      - name: List build output
        run: ls -lh *.iso 2>/dev/null || true

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: carsondeb-amd64-iso
          path: "*.iso"
          if-no-files-found: error
