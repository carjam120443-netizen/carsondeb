name: Build CarsonDEB ISO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Build ISO
        run: |
          sudo lb clean --purge || true
          sudo sh auto/config
          sudo sh auto/build
          sudo chown -R "$USER:$USER" .

      - name: List build output
        run: ls -lh *.iso 2>/dev/null || true

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: carsondeb-amd64-iso
          path: "*.iso"
          if-no-files-found: error
