name: Build CarsonDEB ISO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies and Debian Trixie live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y debian-archive-keyring debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools cpio wget
          wget -q https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          sudo apt-get install -y ./live-build_20250505+deb13u1_all.deb
          test -f /usr/share/keyrings/debian-archive-keyring.gpg
          lb --version

      - name: Configure and build ISO
        run: |
          sudo lb clean --purge || true
          sudo lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "https://deb.debian.org/debian" \
            --mirror-chroot "https://deb.debian.org/debian" \
            --mirror-binary "https://deb.debian.org/debian" \
            --security false \
            --apt-recommends true \
            --initramfs live-boot \
            --firmware-chroot false \
            --linux-flavours "amd64" \
            --linux-packages "linux-image" \
            --debian-installer live \
            --debian-installer-gui true \
            --bootappend-live "boot=live components live-config.username=carson live-config.user-fullname=\"CarsonDEB User\" live-config.user-default-groups=audio,cdrom,dip,floppy,video,plugdev,netdev,powerdev,scanner,bluetooth,sudo" \
            --memtest none \
            --iso-application "CarsonDEB" \
            --iso-publisher "CarsonDEB Project" \
            --iso-volume "CARSONDEB"
          sudo lb build
          sudo chown -R "$USER:$USER" .

      - name: List build output
        run: ls -lh *.iso 2>/dev/null || true

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: carsondeb-amd64-iso
          path: "*.iso"
          if-no-files-found: error
