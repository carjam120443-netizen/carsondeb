# CarsonDEB GRUB boot menu configuration.
# live-build fills the live/install entries into the generated grub.cfg.

set default=0
set timeout_style=menu
set timeout=5

# CarsonDEB branding/colors.
set color_normal=light-gray/black
set color_highlight=white/blue
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue

# Prefer the graphical GRUB terminal when supported.
set gfxmode=auto
terminal_output gfxterm
