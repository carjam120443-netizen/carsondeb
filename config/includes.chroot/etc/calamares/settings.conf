---
modules-search: [ local ]
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - initramfs
  - bootloader
  - umount
- show:
  - finished
branding: carsondeb
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
